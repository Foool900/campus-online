name: Build Android APK

# 云端构建 Android 调试包：本地无需装 Android SDK / JDK。
# 触发方式：手动（Actions → Build Android APK → Run workflow），
#          或 push 到 main 且改动了 client/ 或本 workflow。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # JDK 21：Capacitor 8 的 android 库用 Java 21 编译（JDK 17 会报 invalid source release: 21）
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # GitHub 云主机已预装 Android SDK（$ANDROID_HOME 已设置）；
      # 只需确保许可已接受，AGP 8.13 会自动补齐缺失的 compileSdk/build-tools。
      # 不用 android-actions/setup-android@v3 —— 它会装已不存在的 'tools' 包而失败。
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          if [ -d "$ANDROID_HOME/cmdline-tools" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)
            if [ -n "$SDKMANAGER" ]; then yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true; fi
          fi

      # 只装前端依赖（不碰 server 的 better-sqlite3）
      - name: Install client deps
        working-directory: client
        run: npm install

      # vite build --mode apk 读取 .env.apk（API 指向公网）+ cap sync 拷贝资源到 android
      - name: Build web assets (apk mode) + sync android
        working-directory: client
        run: npm run build:apk

      - name: Build debug APK
        working-directory: client/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: campus-online-debug-apk
          path: client/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
